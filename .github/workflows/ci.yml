name: foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py foundation
  owner:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py owner
  tfhe:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py tfhe
  native-qualification:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        role: [fake-evaluator, cpu-evaluator, owner-fixture]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py qualification --role "${{ matrix.role }}"
  sp1-build:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      manifest_sha256: ${{ steps.guests.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - id: guests
        run: uv run --locked python tools/ci.py sp1-guests
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sp1-guests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sp1/elf/
          if-no-files-found: error
          retention-days: 1
  sp1-measurements:
    needs: sp1-build
    uses: ./.github/workflows/sp1-host.yml
    with:
      stage: sp1-measurements
      guest-artifact-id: ${{ needs.sp1-build.outputs.artifact_id }}
      guest-manifest-sha256: ${{ needs.sp1-build.outputs.manifest_sha256 }}
  sp1-qualification:
    needs: sp1-build
    uses: ./.github/workflows/sp1-host.yml
    with:
      stage: sp1-qualification
      guest-artifact-id: ${{ needs.sp1-build.outputs.artifact_id }}
      guest-manifest-sha256: ${{ needs.sp1-build.outputs.manifest_sha256 }}
  native-reproduction:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py native-reproduction
  verify:
    if: ${{ always() }}
    needs: [foundation, owner, tfhe, native-qualification, native-reproduction, sp1-build, sp1-measurements, sp1-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 tools/ci.py verify
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
