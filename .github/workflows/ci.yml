name: foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py foundation
  owner:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py owner
  tfhe:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py tfhe
  native-qualification:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        role: [fake-evaluator, cpu-evaluator, owner-fixture]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - run: uv run --locked python tools/ci.py qualification --role "${{ matrix.role }}"
  sp1-build:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      manifest_sha256: ${{ steps.guests.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - id: guests
        run: uv run --locked python tools/ci.py sp1-guests
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sp1-guests-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sp1/elf/
          if-no-files-found: error
          retention-days: 1
  sp1-measurements:
    needs: sp1-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Install SP1 host protobuf prerequisites
        timeout-minutes: 7
        run: python3 tools/install_sp1_host.py
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.sp1-build.outputs.artifact_id }}
          merge-multiple: true
          path: build/sp1/elf/
      - run: uv run --locked python tools/ci.py sp1-measurements --manifest-sha256 "$GUEST_MANIFEST_SHA256"
        env:
          GUEST_MANIFEST_SHA256: ${{ needs.sp1-build.outputs.manifest_sha256 }}
  sp1-qualification:
    needs: sp1-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Install SP1 host protobuf prerequisites
        timeout-minutes: 7
        run: python3 tools/install_sp1_host.py
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.sp1-build.outputs.artifact_id }}
          merge-multiple: true
          path: build/sp1/elf/
      - run: uv run --locked python tools/ci.py sp1-qualification --manifest-sha256 "$GUEST_MANIFEST_SHA256"
        env:
          GUEST_MANIFEST_SHA256: ${{ needs.sp1-build.outputs.manifest_sha256 }}
  verify:
    if: ${{ always() }}
    needs: [foundation, owner, tfhe, native-qualification, sp1-build, sp1-measurements, sp1-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 tools/ci.py verify
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
