name: foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: uv sync --locked
      - run: uv run --locked python tools/verify.py native
      - run: cargo run --locked -p kryvola-engine-api --example inspect
      - run: ./build/cpp/engine_foundation
  sp1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: uv sync --locked
      - run: uv run --locked python tools/feasibility.py sp1-relation
  verify:
    if: ${{ always() }}
    needs: [native, sp1]
    runs-on: ubuntu-24.04
    steps:
      - run: python -c "import os; assert os.environ['NATIVE'] == os.environ['SP1'] == 'success'"
        env:
          NATIVE: ${{ needs.native.result }}
          SP1: ${{ needs.sp1.result }}
