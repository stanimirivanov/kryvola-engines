name: engines-m1-publication
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      cpu_sha256:
        description: Owner-selected cpu-runtime.tar SHA-256
        type: string
      image_sha256:
        description: Owner-selected CPU image configuration SHA-256
        type: string
      owner_sha256:
        description: Owner-selected owner wheel SHA-256
        type: string
      approve_development_distribution:
        description: I approve development distribution of these exact three artifacts (not independent review)
        type: boolean
        default: false
        required: true

permissions:
  contents: read
concurrency:
  group: engines-m1-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: uv sync --locked
      - run: uv run --locked python tools/release.py install
      - run: uv run --locked python tools/m1_release.py prepare
      # Do not upload denied TFHE binaries/wheels as Actions artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: m1-review-metadata
          path: build/m1/*.json
          if-no-files-found: error
          retention-days: 7
  qualify-publication:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CPU_SHA256: ${{ inputs.cpu_sha256 }}
      OWNER_SHA256: ${{ inputs.owner_sha256 }}
      IMAGE_SHA256: ${{ inputs.image_sha256 }}
      OWNER_APPROVAL: ${{ inputs.approve_development_distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: uv sync --locked
      - name: Require owner approval and exact artifact pins
        run: test "$GITHUB_ACTOR" = stanimirivanov && test "$OWNER_APPROVAL" = true && test -n "$CPU_SHA256" && test -n "$OWNER_SHA256" && test -n "$IMAGE_SHA256"
      - run: uv run --locked python tools/release.py install
      - run: uv run --locked python tools/m1_release.py prepare
      - name: Record exact owner approval before transferring native artifacts
        run: uv run --locked python tools/m1_release.py authorize --source "$GITHUB_SHA" --cpu-sha256 "$CPU_SHA256" --owner-sha256 "$OWNER_SHA256" --image-sha256 "$IMAGE_SHA256" --approve-development-distribution
      - uses: actions/upload-artifact@v4
        with:
          name: approved-m1-candidate
          path: build/m1/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: qualify-publication
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      CPU_SHA256: ${{ inputs.cpu_sha256 }}
      OWNER_SHA256: ${{ inputs.owner_sha256 }}
      IMAGE_SHA256: ${{ inputs.image_sha256 }}
      OWNER_APPROVAL: ${{ inputs.approve_development_distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          name: approved-m1-candidate
          path: build/m1
      - name: Refuse existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="m1-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$existing" ]; then echo 'M1 tag exists; refusing replacement'; exit 1; fi
          if gh release view "$tag"; then echo 'M1 release exists; refusing replacement'; exit 1; fi
      - run: uv run --locked python tools/release.py install
      - name: Verify exact owner approval before pushing the CPU image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          uv run --locked python tools/m1_release.py publish-image --source "$GITHUB_SHA" --cpu-sha256 "$CPU_SHA256" --owner-sha256 "$OWNER_SHA256" --image-sha256 "$IMAGE_SHA256"
      - name: Sign the final inventory and verify source, image and owner approval
        run: |
          build/release-tools/cosign sign-blob --yes --bundle build/m1/manifest.sigstore.json build/m1/manifest.json
          uv run --locked python tools/m1_release.py verify --source "$GITHUB_SHA"
      - name: Publish a fresh M1 draft then expose the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="m1-${GITHUB_SHA}"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "$tag" --notes 'Owner-approved M1 development delivery; no independent legal/security review or third-party rights grant; no production approval.' build/m1/*
          gh release edit "$tag" --draft=false
