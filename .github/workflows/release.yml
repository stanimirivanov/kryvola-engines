name: experimental-fake-release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: uv sync --locked
      - run: uv run --locked python tools/qualify_release.py fake
      - name: Sign and verify exact workflow identity
        run: |
          build/release-tools/cosign sign-blob --yes --bundle build/packages/fake-evaluator/manifest.sigstore.json build/packages/fake-evaluator/manifest.json
          uv run --locked python tools/release.py verify --output build/packages/fake-evaluator --publish-check
      - name: Publish once at an immutable experimental commit version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="experimental-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$existing" ]; then echo 'Tag already exists'; exit 1; fi
          if gh release view "$tag"; then echo 'Version already exists; refusing replacement'; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes 'Fake loopback fixture only. TFHE/SP1 distribution remains blocked.' build/packages/fake-evaluator/package.tar build/packages/fake-evaluator/sbom.json build/packages/fake-evaluator/provenance.json build/packages/fake-evaluator/manifest.json build/packages/fake-evaluator/manifest.sigstore.json
