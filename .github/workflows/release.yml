name: experimental-fake-release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-release
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: uv sync --locked
      - run: uv run --locked python tools/qualify_release.py fake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-fake
          path: |
            build/packages/fake-evaluator/*
            build/runtime-fake.tar
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-fake
          path: build
      - run: uv sync --locked
      - run: uv run --locked python tools/release.py install
      - name: Sign and verify exact workflow identity
        run: |
          build/release-tools/cosign sign-blob --yes --bundle build/packages/fake-evaluator/manifest.sigstore.json build/packages/fake-evaluator/manifest.json
          uv run --locked python tools/release.py verify --output build/packages/fake-evaluator --publish-check
      - name: Publish and verify the digest-pulled fake OCI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          uv run --locked python tools/oci_release.py publish --source "$GITHUB_SHA"
      - name: Name the OCI evidence assets separately
        run: |
          for name in manifest.json manifest.sigstore.json provenance.json sbom.json; do
            cp "build/oci/$name" "build/oci/oci-$name"
          done
      - name: Publish once at an immutable experimental commit version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="experimental-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$existing" ]; then echo 'Tag already exists'; exit 1; fi
          if gh release view "$tag"; then echo 'Version already exists; refusing replacement'; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes 'Fake loopback fixture only. TFHE/SP1 distribution remains blocked.' build/packages/fake-evaluator/package.tar build/packages/fake-evaluator/sbom.json build/packages/fake-evaluator/provenance.json build/packages/fake-evaluator/manifest.json build/packages/fake-evaluator/manifest.sigstore.json build/oci/oci-manifest.json build/oci/oci-manifest.sigstore.json build/oci/oci-provenance.json build/oci/oci-sbom.json
