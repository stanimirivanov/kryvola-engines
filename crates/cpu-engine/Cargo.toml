[package]
name = "kryvola-cpu-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kryvola-engine-api = { path = "../engine-api" }
tonic = "=0.14.6"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
prost = "=0.14.4"
bytes = "=1.12.1"
blake3 = "=1.8.7"
hex = "=0.4.3"
base64 = "=0.22.1"
ring = "=0.17.14"
tempfile = "=3.27.0"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
spiffe = { version = "=0.19.0", default-features = false, features = ["x509-source"] }
spiffe-rustls = { version = "=0.11.0", default-features = false, features = ["ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
jsonschema = { version = "=0.60.1", default-features = false }

[lints]
workspace = true
