[package]
name = "kryvola-owner-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace]
members = ["python"]

[dependencies]
blake3 = "=1.8.7"
tfhe = { version = "=1.8.1", default-features = false, features = ["integer", "software-prng", "zk-pok"] }

[profile.release]
opt-level = 1
debug = 0
lto = false
codegen-units = 64
