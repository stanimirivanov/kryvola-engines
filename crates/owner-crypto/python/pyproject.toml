[build-system]
requires = ["maturin==1.10.2"]
build-backend = "maturin"

[project]
name = "kryvola-owner"
version = "0.1.0.dev1"
description = "Owner-local FHE-Q1 research bindings; not qualified for distribution"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
bindings = "pyo3"
locked = true
