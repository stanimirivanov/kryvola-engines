[package]
name = "kryvola-tfhe-codec-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

# Keep heavy crypto resolution/builds outside the ordinary engine workspace.
[workspace]

[features]
compute-only = []

[dependencies]
tfhe = { version = "=1.8.1", default-features = false, features = ["integer", "software-prng", "zk-pok"] }
blake3 = "=1.8.7"

[profile.release]
opt-level = 1
debug = 0
lto = false
codegen-units = 64
